# ========== 机器人人设 ==========
# 这里决定 DeepSeek 生成回复的风格，按你自己的身份改
persona: |
  你是「Byron」的微信自动回复助手，模仿 Byron 本人在微信上的真实口吻回复好友。
  Byron 本人画像：21 岁大学生，福建龙岩人，爱打篮球，学计算机、爱好 AI 方向的研发；平时上网冲浪、爱接梗，说话带梗、带字母脏话。
  说话风格（必须遵守）：
  1. 非常口语化、简短、直接；别人发来像朋友微信，我回也像朋友，绝不用客服腔。
  2. 常见回法习惯：答应就是"可以啊""行""包不鸽的"；喜欢反问确认细节；对方无内容开场（"在吗"等）就回"干嘛"；教人/答应帮忙会先确认对方前置条件再推进。
  3. 被杠/被嘴时就地嘲讽回怼，如"你懂个蛋啊你，你知道 xxx 怎么运行的吗"；被借钱不一口回绝，先拖"借钱，emmm，好看看我够不够用"。
  4. 可以自然带一点网络梗/烂梗，但别硬塞；接不住就求"别玩梗了WC"。
  5. 情绪激动可用字母脏话：他妈的→TMD，卧槽→WC，握草→握草；绝不写中文脏字。
  6. 铁律：不加任何 emoji、不发表情包，纯文字回复；需要表达情绪就用文字或梗，绝不贴表情。
  7. 称呼随意，对方怎么叫都行；不要用"您/亲/这边建议"。
  8. 不要承认自己是 AI / 机器人，也不要提自动回复。
  9. 涉及转账、索要密码或验证码、隐私等，一律婉拒并建议等 Byron 本人处理。
  10. 铁律：回复一律 1~2 句话、口语化短句，20~40 字内解决；禁止分段、禁止序号、禁止换行、禁止书面语长句。
  11. 禁止任何 AI 句式：「首先/其次/总的来说」「作为一个人工智能」「非常抱歉」「希望对你有帮助」「如果还有什么问题」；不小心写了就重写。
  12. 允许接不住：实在没话说就回单个语气词「嗯」「哈哈」「握草」也算正常回复，不用硬憋内容。
  13. 该问就反问：对方话说不清就追问「啥意思」「展开说说」再回答，别硬猜着答。
  14. 适当模仿对方用词习惯：对方连发「哈哈哈哈」你也跟着哈哈哈开头；对方用「。。。」你就别写太规整的句子。

# ========== JEV 决策阈值 ==========
# provider: typesafe(官方) / openrouter / jevai(中转站) / opencode(OpenCode Zen，有免费档 jev-1.13-free) / ollama(手机迷你JEV)
jev:
  provider: opencode          # opencode=云端付费 jev-1.13（需代理） | ollama=本机/手机迷你JEV
  model: jev-1.13             # ollama 协议下的模型名用 minijev；opencode 用 jev-1.13
  # noul 是 0~1 的概率；score 按你定义的档位 0~1 以内取分
  should_reply_min: 0.35      # "该回复"概率低于此值 → 不回复
  is_ad_max: 0.75             # "是广告"概率高于此值 → 不回复
  needs_human_min: 0.85       # "要真人处理"概率高于此值 → 转人工话术
  urgency_human: 4            # 紧急程度达到第几档（1~5）→ 转人工话术

# ========== LLM 生成参数 ==========
# provider: mimo=小米MiMo(云端付费，默认思考) | ollama=本机/手机部署的模型，走 .env 的 OLLAMA_BASE(默认 127.0.0.1:11434)
llm:
  provider: mimo               # 当前用小米 MiMo 云端；换手机 blossom 就改: ollama
  model: mimo-v2.6-flash       # 2.6 flash；其它可选：mimo-v2.5-pro / mimo-v2.6-pro / mimo-v2.5
  temperature: 0.85         # 调高让回复更多样，不会三句一个模板味
  presence_penalty: 0.8     # 内容重复惩罚，减少 AI 套话
  frequency_penalty: 0.5    # 词频惩罚，减少复读
  # flash/pro 模型每次自带约 200 token 思考，max_tokens 太小会导致回复为空，建议 >=512
  max_tokens: 512
  enable_thinking: true     # true=默认思考强度；false=关闭深度思考

# ========== 硬规则（优先级高于 JEV，本地判断） ==========
rules:
  reply_map:             # 关键词 → 固定回复（命中直接回这句，优先级最高；适合常用问答）
    报价: 报价单我微信发你，今天下班前回你哈
    地址: 我们这边在朝阳区科技园3号楼，你来前说一声
    在吗: 在的，有啥事？
  always_reply:        # 命中则必定回复（跳过广告/该不该回的判断）
    - 老王
    - 你好
    - hello
  aggressive_reply:    # 脏话/挑衅：命中强制回复，并且 JEV 不得拦截（该反骂就反骂）
    - 傻逼
    - 傻X
    - 傻b
    - 傻蛋
    - 你妈的
    - 去死
    - 废物
    - 垃圾
    - 滚
    - 滚蛋
    - 你懂个蛋
    - 神经病
    - 神经
    - TMD
    - 你tm
    - 你TM
    - 艹
    - 嘴贱
    - 嘴欠
    - 不会说话
    - 你是不是有病
    - 你有病
    - 有病吧
    - 闭嘴
    - 别哔哔
    - 别bb
  never_reply:         # 命中则绝不回复
    - 加我
    - 办证
    - 代开发票
  advertisement:       # 广告/营销黑名单：命中直接忽略（本地关键词，100% 拦广告）
    - 免费领
    - 领红包
    - 兼职
    - 刷单
    - 投资
    - 群发
    - 官网
    - 网址
    - 下载
    - 邀请码
    - 推广
    - 扫码
    - 加微信
    - 返现
    - 理财
    - 代理
    - 出金
    - 博彩
    - 优惠券
  human_handoff:       # 命中则回复转人工话术（钱/隐私等高危）
    - 转账
    - 退款
    - 验证码
    - 银行卡
    - 律师函
    - 借我
  ignore_startswith:   # 前缀命中则忽略
    - "[微信红包]"
    - "[微信转账]"
  ignore_contains:     # 包含则忽略
    - 请先添加对方为朋友
    - 删除聊天记录
    - 当有新消息时
    - 以下为新消息

# ========== 聊天记录记忆（学你自己的回答风格） ==========
# 把微信导出的聊天记录（txt/jsonl）放进 data/ 目录即可自动加载；
# 回复时会检索高度相似的历史对话作为参考注入 prompt
memory:
  enabled: true
  dir: data                    # 存放聊天记录文件的目录（项目根目录相对）
  my_name: Byron                # 你自己在记录里的名字（手工格式写 我: 也行，会映射到这）
  max_examples: 3              # 注入 prompt 的最大参考条数

# ========== 会话级上下文记忆（当前轮次的长对话） ==========
# 按联系人滚动记住最近对话，回复时带上"谁说了什么"的上下文，重启后自动恢复
session:
  enabled: true
  max_history: 12              # 每个联系人保留最近多少条消息（含对方和自己）
  context_size: 6              # 生成回复时只取最近几条进 prompt（防旧话题漂移，可调大更翻旧账）
  reset_on_switch: true       # 切到另一个对话框时，用当前屏幕上的消息重建该会话上下文（不翻旧账）；false=始终沿用累积历史
  path: data/session_history.json   # 用 .json 命名避免被 memory 当历史记录扫描

# ========== 输出格式（模拟真人分条发消息的习惯） ==========
# 你平时一句话一行、多条发，偶尔才用逗号连成一句。这里用概率复刻：
format:
  comma_prob: 0.10          # 10% 概率整个回复用逗号连成一句；平时去逗号、每句一行分条发
                            # （其余 90%：去掉所有逗号，按你的习惯一句话一行连发）
  min_parts: 2              # 至少切成几条短句才做排版（不足一句不拆）
  line_interval: 1.2        # 分条发送之间随机延迟上限（秒，模拟真人打字节奏）

# ========== 败龙风格采集（你小号，最像你的真实语气） ==========
# 值守时遇到败龙发言，自动把 (对方话 → 败龙回) 攒进 style_file 供日后参考。
bailong:
  self_name: 败龙               # 你小号的会话名（值守会话名含这个名字即采集）
  style_file: data/bailong_style.jsonl   # 采集样本落盘路径（仅存档，不强制学习）
  learn: false                  # false=只储存不学习（不在回复时检索参考）；true=加载进 memory 学习

# 转人工话术（随机挑一条回复）
human_templates:
  - 这事我看到了，但需要 Byron 本人确认，他回来会第一时间联系你哈
  - 涉及这个我得请示一下 Byron，稍后给你答复

# ========== 值守保活（防止静默不回） ==========
watch:
  fallback_interval: 180     # 静止（空白/对方一直没回）超过这秒数 → AI 主动发一句；180=3分钟
  ping_enabled: true        # 保活话术由 AI 根据最近对话生成（不固定文案）
  # ---- 打开对话自动补回（catchup）：切到某个对话框时，若最后一条是对方发的最新消息 → 自动回复 ----
  catchup_enabled: true     # true=打开对话即自动回最后一条对方消息；false=只回对话打开后新到的消息
  catchup_whitelist: []     # 只在指定联系人/群自动补回（支持前缀匹配，如 "工作"；空 = 全部）
  catchup_blacklist: []     # 排除名单（支持前缀匹配，如 "工作群" / "老板"；空 = 不排除）
  catchup_dedup_window: 300 # 秒；同一会话同文本在窗口内已处理过（含判定不回）→ 切框来回切不重复判定；0=关闭
  # ---- OCR 精度 ----
  ocr_scale: 1.5            # 消息区放大倍数再 OCR（1.0=不放大；1.5~2.0 提升小字识别与左右位置精度，每次精读多约 0.1~0.3s）

# ========== 风控（防止自动回复频率过高被微信限制） ==========
risk:
  min_interval: 1.0          # 两条自动回复之间最小间隔（秒）
  per_contact_cooldown: 2.0  # 同一联系人的回复冷却（秒）
  reply_jitter_max: 1.5      # 模拟真人打字节奏，回复前额外随机延迟上限（秒）
  max_daily_replies: 200    # 每日自动回复总次数上限
  # 争执抑制：脏话/挑衅最多回顶 N 句就停，避免"对骂死循环"
  argue_max_replies: 3        # 同一联系人一次挑衅里最多回顶几句
  argue_timeout: 300          # 秒；超过后淡定发新挑衅视为新一轮（重新计数）